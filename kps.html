<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rockPaperScissors</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: rgb(0, 0, 0);
        }
    </style>

    <script>

        function kps(parameter) {

            let randomNumber = Math.random()
            let option = Math.floor(randomNumber * 3 + 1)

            let optionText
            let result
            
            
            if (parameter == "rock" && option == 1) {
                
                result = "It's a draw."
                
            } else if (parameter == "rock" && option == 2) {
                
                result = "Computer wins."
                
            } else if (parameter == "rock" && option == 3) {
                
                result = "You win."
                
            }
            
            
            if (parameter == "paper" && option == 1) {
                
                result = "You win."
                
            } else if (parameter == "paper" && option == 2) {
                
                result = "It's a draw."
                
            } else if (parameter == "paper" && option == 3) {
                
                result = "Computer wins."
                
            }
            
            
            if (parameter == "scissors" && option == 1) {
                
                result = "Computer wins."
                
            } else if (parameter == "scissors" && option == 2) {
                
                result = "You win."
                
            } else if (parameter == "scissors" && option == 3) {
                
                result = "It's a draw."
                
            }

            
            if (option == 1) {

                optionText = "rock. "
                console.log("You chose " + parameter + ", computer chose rock. " + result)

            } else if (option == 2) {

                optionText = "paper. "
                console.log("You chose " + parameter + ", computer chose paper. " + result)

            } else {

                optionText = "scissors. "
                console.log("You chose " + parameter + ", computer chose scissors. " + result)
            }

            
            let messageElement = document.getElementById("message")
            messageElement.innerHTML = "You chose " + parameter + ", computer chose " + optionText + result

        }

    </script>

</head>

<body>

    <div class="center vertical-box align-center h-full font text-white">

        <div class="center horizontal-box align-center">

            <div class="vertical-box align-center">

                <button onclick="kps('rock')"><img class="img-width2" src="images/image copy 11.png"
                        alt="image"></button>
                <h2>Rock</h2>

            </div>

            <div class="vertical-box align-center">

                <button onclick="kps('paper')"><img class="img-width2" src="images/image copy 12.png"
                        alt="image"></button>
                <h2>Paper</h2>

            </div>

            <div class="vertical-box align-center">

                <button onclick="kps('scissors')"><img class="img-width2" src="images/image copy 13.png"
                        alt="image"></button>
                <h2>Scissors</h2>

            </div>

        </div>

        <div id="message"></div>

    </div>

</body>

</html>
