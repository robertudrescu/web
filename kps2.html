<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rockPaperScissors2</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: ghostwhite;
        }
    </style>

    <script>

        function getOptionText(option) {

            if (option == 0) {

                return "rock"

            } else if (option == 1) {

                return "paper"

            } else if (option == 2) {

                return "scissors"

            }

        }

        function play(userOption) {

            let randomNumber = Math.random()
            let computerOption = Math.floor(randomNumber * 3)
            let option
            let winCheck = userOption - computerOption


            if (userOption == computerOption) {

                result = ". It's a draw."

            } else if (winCheck == 1 || winCheck == -2) {

                result = ". You win."

            } else {

                result = ". Computer wins."

            }

            let message = "You chose " + getOptionText(userOption) + ". Computer chose " + getOptionText(computerOption) + result

            let messageElement = document.getElementById("message")
            messageElement.innerHTML = message
            console.log(message)

        }

    </script>

</head>

<body>

    <div class="vertical-box padding-5 center font align-center">

        <h1>Choose an option</h1>

        <div class="horizontal-box padding-1">

            <div>
                <button onclick="play(0)" class="font">Rock</button>
            </div>

            <div>
                <button onclick="play(1)" class="font">Paper</button>
            </div>

            <div>
                <button onclick="play(2)" class="font">Scissors</button>
            </div>

        </div>

        <div id="message"></div>

    </div>

</body>

</html>
