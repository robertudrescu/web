<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>

    <link rel="stylesheet" href="memo.css">

</head>

<body>

    <div class="y gap x-center y-center h-full">

        <div class="x">
            <div class="luminari font-size1-8" id="player1"></div>
            <div class="luminari font-size1-8" id="player2"></div>
        </div>
        <div class="luminari font-size2" id="2"></div>

        <div class="gap">
            <button memocolor="yellow" onclick="play(event)"></button>
            <button memocolor="green" onclick="play(event)"></button>
            <button memocolor="purple" onclick="play(event)"></button>
            <button memocolor="red" onclick="play(event)"></button>
        </div>

        <div class="gap">
            <button memocolor="pink" onclick="play(event)"></button>
            <button memocolor="blue" onclick="play(event)"></button>
            <button memocolor="pink" onclick="play(event)"></button>
            <button memocolor="green" onclick="play(event)"></button>
        </div>

        <div class="gap">
            <button memocolor="red" onclick="play(event)"></button>
            <button memocolor="yellow" onclick="play(event)"></button>
            <button memocolor="purple" onclick="play(event)"></button>
            <button memocolor="cyan" onclick="play(event)"></button>
        </div>

        <div class="gap">
            <button memocolor="blue" onclick="play(event)"></button>
            <button memocolor="orange" onclick="play(event)"></button>
            <button memocolor="cyan" onclick="play(event)"></button>
            <button memocolor="orange" onclick="play(event)"></button>
        </div>

        <button class="gap button2 y-center x-center hide" id="1" onclick="flipBack(event)">Flip back</button>

    </div>

    <script>

        let currentCount = 0
        let colorElement1
        let colorElement2
        let flip = document.getElementById("1")
        let color1
        let color2
        let score1 = 0
        let score2 = 0
        let turn = 1
        let totalCount = 0

        function play(e) {

            let element = e.target
            let color = element.getAttribute("memocolor")
            let win = document.getElementById("2")
            let winText

            if (currentCount == 0) {

                color1 = 0

                if (element.getAttribute("class") == null) {

                    if (color == "green") {

                        color1 = 1

                    } else if (color == "red") {

                        color1 = 2

                    } else if (color == "blue") {

                        color1 = 3

                    } else if (color == "pink") {

                        color1 = 4

                    } else if (color == "yellow") {

                        color1 = 5

                    } else if (color == "purple") {

                        color1 = 6

                    } else if (color == "orange") {

                        color1 = 7

                    } else if (color == "cyan") {

                        color1 = 8

                    }

                    element.setAttribute("class", color)
                    currentCount = currentCount + 1
                    colorElement1 = e.target
                }

            } else if (currentCount == 1) {

                color2 = 0

                if (color == "green") {

                    color2 = 1

                } else if (color == "red") {

                    color2 = 2

                } else if (color == "blue") {

                    color2 = 3

                } else if (color == "pink") {

                    color2 = 4

                } else if (color == "yellow") {

                    color2 = 5

                } else if (color == "purple") {

                    color2 = 6

                } else if (color == "orange") {

                    color2 = 7

                } else if (color == "cyan") {

                    color2 = 8

                }

                if (element.getAttribute("class") == null) {

                    element.setAttribute("class", color)
                    currentCount = currentCount + 1
                    colorElement2 = e.target
                }

                if (color1 == color2) {

                    currentCount = 0
                    totalCount = totalCount + 1

                    if (turn == 1) {

                        score1 = score1 + 1

                    } else if (turn == 2) {

                        score2 = score2 + 1
                    }

                } else {

                    if (turn == 2) {

                        turn = 1

                    } else if (turn == 1) {

                        turn = 2

                    }

                    flip.setAttribute("class", "show button2")

                }

                if (totalCount == 8) {

                    if (score1 == score2) {

                        winMessage = "Draw"

                    } else if (score1 > score2) {

                        winMessage = "Player 1 won"

                    } else if (score1 < score2) {

                        winMessage = "Player 2 won"

                    }

                    win.innerHTML = winMessage

                }

            }

            let message1 = "P1 score: " + score1
            let message2 = "P2 score: " + score2
            let messageElement1 = document.getElementById("player1")
            let messageElement2 = document.getElementById("player2")
            messageElement1.innerHTML = message1
            messageElement2.innerHTML = message2

        }

        function flipBack() {

            if (currentCount == 2) {

                colorElement1.removeAttribute("class")
                colorElement2.removeAttribute("class")
                currentCount = 0
                flip.setAttribute("class", "hide")

            }

        }

    </script>

</body>

</html>
