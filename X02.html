<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X02</title>

    <link rel="stylesheet" href="X02.css">

</head>

<body>

    <div class="y justify-center align-center h-full">

        <div class="lumi" id="message"></div>

        <div class="x">

            <button class="button" onclick="play(event)"></button>
            <button class="button" onclick="play(event)"></button>
            <button class="button" onclick="play(event)"></button>

        </div>

        <div class="x">

            <button class="button" onclick="play(event)"></button>
            <button class="button" onclick="play(event)"></button>
            <button class="button" onclick="play(event)"></button>

        </div>

        <div class="x">

            <button class="button" onclick="play(event)"></button>
            <button class="button" onclick="play(event)"></button>
            <button class="button" onclick="play(event)"></button>

        </div>

        <div class="gap padding">

            <button class="button2 gap" onclick="restart(event)">Restart</button>

        </div>

    </div>

    <script>

        let currentSign = "x"
        let messageElement = document.getElementById("message")
        messageElement.innerHTML = currentSign

        function restart(i) {
 
            console.log("Restart")
            messageElement.innerHTML= "x"
            currentSign = "x"
            
        }

        function play(e) {

            let element = e.target

            console.log("before:", element.innerHTML)


            if (element.innerHTML == "") {

                element.innerHTML = currentSign


                if (currentSign == "x") {

                    currentSign = "o"

                } else if (currentSign == "o") {

                    currentSign = "x"

                }

            }

            let messageElement = document.getElementById("message")
            messageElement.innerHTML = currentSign
            console.log("after:", element.innerHTML)
        }

    </script>

</body>

</html>
